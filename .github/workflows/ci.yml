name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      # Serveur IMAP de test pour les alertes e-mail (npm run test:imap).
      greenmail:
        image: greenmail/standalone:2.1.5
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alertes:mot-de-passe-app@localhost"
        ports: ["3143:3143"]
    env:
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/jobpilot_test
      DATABASE_URL: postgres://postgres@localhost:5432/jobpilot_e2e
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create databases
        run: |
          psql -h localhost -U postgres -c "create database jobpilot_test"
          psql -h localhost -U postgres -c "create database jobpilot_e2e"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Alertes e-mail contre un vrai serveur IMAP (GreenMail)
        run: npm run test:imap
      - name: Migrations apply on an empty database
        run: |
          psql -h localhost -U postgres -c "create database jobpilot_migrations"
          DATABASE_URL=postgres://postgres@localhost:5432/jobpilot_migrations npm run db:migrate
      - name: Schema matches migrations
        run: |
          npx drizzle-kit generate --name ci-drift-check
          git diff --exit-code --stat -- drizzle || (echo "Le schéma Drizzle diffère des migrations commitées : lancer npm run db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (echo "Migration manquante : lancer npm run db:generate" && git status --porcelain -- drizzle && exit 1)
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  image:
    # L'image de déploiement (ADR 0010) se construit et contient les outils des sauvegardes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jobpilot:ci .
      - run: docker run --rm jobpilot:ci sh -c 'node --version && pg_dump --version && rclone version | head -1 && test -f web/server.js && bash -n scripts/backup.sh'
